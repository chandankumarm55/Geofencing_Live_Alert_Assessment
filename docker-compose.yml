version: '3.9'

services:
  mongodb:
    image: mongo:7
    container_name: geo_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - geonet

  backend:
    build: ./Backend
    container_name: geo_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - DB_NAME=geofencing_db
      - PORT=8080
    depends_on:
      - mongodb
    networks:
      - geonet

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: geo_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - geonet

volumes:
  mongo_data:

networks:
  geonet:
    driver: bridge
